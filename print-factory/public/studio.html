<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <title>ViPrint Studio — Produkte Printimi</title>
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; background: #f6f4f0; }
      #c { position: fixed; inset: 0; display: block; }
      /* vinjeta e butë e studios */
      #vignette {
        position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 55%, rgba(30,20,15,0.16) 100%);
      }
      /* kokrra filmi (grain) */
      #grain {
        position: fixed; inset: 0; pointer-events: none; opacity: 0.055;
        mix-blend-mode: overlay;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/></filter><rect width="180" height="180" filter="url(%23n)"/></svg>');
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three.module.js",
          "three/addons/": "/vendor/addons/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="vignette"></div>
    <div id="grain"></div>
    <script type="module" src="./studio.js"></script>
  </body>
</html>
